<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120f1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pixels Racing</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud" hidden></div>
      <div id="touch" hidden>
        <div class="pad left">
          <div class="tbtn" data-k="left">◀</div>
          <div class="tbtn" data-k="right">▶</div>
        </div>
        <div class="pad right">
          <div class="col">
            <div class="tbtn small item" data-k="item">OBJET</div>
            <div class="tbtn small boost" data-k="boost">TURBO</div>
          </div>
          <div class="tbtn" data-k="brake">FREIN</div>
          <div class="tbtn big" data-k="gas">GAZ</div>
        </div>
      </div>
      <div id="screens"></div>
      <div id="toast"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
